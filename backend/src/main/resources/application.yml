spring:
  flyway:
    # Solo se usa con PostgreSQL (perfiles pg y prod). En desarrollo con H2 el esquema lo crea Hibernate.
    enabled: false
    locations: classpath:db/migration
  application:
    name: sap-uam-backend
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
  # Perfil por defecto: desarrollo con H2 en memoria.
  profiles:
    active: dev

server:
  port: 8080
  tomcat:
    # Menos hilos que conexiones del pool: ver DatabaseLoginThrottleService.recordFailure.
    threads:
      max: ${SERVER_THREADS_MAX:32}
  error:
    # Nunca exponer detalles internos en las respuestas de error.
    include-stacktrace: never
    include-exception: false

# ----------------------------------------------------------------------------
# Configuracion propia de la app
# ----------------------------------------------------------------------------
app:
  # URL publica del frontend: va dentro de los correos de invitacion.
  public-url: ${APP_PUBLIC_URL:http://localhost:8765}
  mail:
    # log: no envia nada, deja el texto visible para el administrador (solo desarrollo).
    # smtp: envia por el servidor configurado en spring.mail.* (obligatorio en produccion).
    mode: ${APP_MAIL_MODE:log}
    from: ${APP_MAIL_FROM:admision@uam.edu.ni}
  privacy:
    version: 1
    contact-email: ${APP_PRIVACY_EMAIL:privacidad@uam.edu.ni}
  retention:
    # Meses que se conservan los datos identificables despues de la evaluacion; luego se anonimizan.
    months: ${APP_RETENTION_MONTHS:24}
    enabled: ${APP_RETENTION_ENABLED:false}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrador SAP-UAM}
  session-cookie:
    secure: false
  mfa:
    # Clave AES de desarrollo. En produccion se exige una distinta de 32 bytes.
    encryption-key: ${APP_MFA_ENCRYPTION_KEY:dev-mfa-key-32-bytes-change-now!}
  assessment:
    # Provisional aprobado: el tiempo sigue corriendo durante una reconexion.
    weil-duration-seconds: ${WEIL_DURATION_SECONDS:1200}
  jwt:
    # Secreto para firmar el JWT propio (NO el token de Moodle).
    # En produccion definir APP_JWT_SECRET como variable de entorno (>= 32 bytes).
    secret: ${APP_JWT_SECRET:cambia-este-secreto-de-desarrollo-por-uno-largo-y-aleatorio-1234567890}
    # Vigencia del token en milisegundos (24h por defecto).
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    issuer: sap-uam-weill
  cors:
    # Origenes permitidos para el frontend (separar por coma).
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8766,http://127.0.0.1:8766}
  moodle:
    # Base del Moodle de la UAM. Las 2 llamadas se hacen server-to-server.
    base-url: ${MOODLE_BASE_URL:https://uamvirtual.uam.edu.ni/grado}
    service: moodle_mobile_app
    # Timeouts de las llamadas a Moodle (ms).
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

---
# ============================ PERFIL DEV (H2) ===============================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:sapweill;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ===================== PERFIL PG (desarrollo con PostgreSQL) =====================
# Igual que dev, pero con PostgreSQL y el esquema creado por las migraciones (ops/dev-postgres.sh).
spring:
  config:
    activate:
      on-profile: pg
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/sapweill}
    username: ${DB_USER:sapweill}
    password: ${DB_PASSWORD:sapweill-dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
# ========================= PERFIL PROD (Postgres) ===========================
spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Managua

# En produccion estos valores son obligatorios y no tienen valor por defecto:
# si falta alguno, la aplicacion no arranca (en vez de usar una clave conocida).
app:
  public-url: ${APP_PUBLIC_URL}
  mail:
    mode: smtp
    from: ${APP_MAIL_FROM}
  retention:
    enabled: ${APP_RETENTION_ENABLED:true}
  session-cookie:
    secure: true
  mfa:
    encryption-key: ${APP_MFA_ENCRYPTION_KEY}
  jwt:
    secret: ${APP_JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS}

server:
  # Detras de un proxy/balanceador: respeta X-Forwarded-* (cookie Secure e IP real).
  forward-headers-strategy: framework
