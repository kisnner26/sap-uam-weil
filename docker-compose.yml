# Despliegue de referencia: PostgreSQL + backend + nginx. Uso: cp .env.example .env (completar) && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapuam
      POSTGRES_USER: sapuam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapuam -d sapuam"]
      interval: 10s
      retries: 5
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/sapuam
      DB_USER: sapuam
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?}
      APP_MFA_ENCRYPTION_KEY: ${APP_MFA_ENCRYPTION_KEY:?}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:?}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?}
      APP_CORS_ORIGINS: ${APP_PUBLIC_URL:?}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      APP_MAIL_FROM: ${APP_MAIL_FROM:?}
      APP_PRIVACY_EMAIL: ${APP_PRIVACY_EMAIL:-}
      MAIL_HOST: ${MAIL_HOST:?}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-80}:80"]
volumes:
  dbdata:
